{% extends 'base.html' %}{% block titulo %}Crear cuenta · Game Shop{% endblock %}{% block contenido %}<section class="section narrow"><div class="auth-panel"><div class="eyebrow">ÚNETE A GAME SHOP</div><h1>Crear cuenta</h1><p class="muted">Regístrate para completar tus compras simuladas.</p><form method="post" class="auth-form"><input type="hidden" name="_csrf" value="{{csrf_token}}"><label>Nombre<input name="nombre" maxlength="80" required></label><label>Correo electrónico<input name="correo" type="email" maxlength="254" required></label><label>Contraseña (mínimo 8 caracteres)<input name="clave" type="password" minlength="8" maxlength="128" autocomplete="new-password" required></label><label>Código de configuración de administrador (solo si corresponde)<input name="admin_setup_token" type="password" autocomplete="off" placeholder="Déjalo vacío si eres cliente"></label><button class="btn green">Crear cuenta</button></form><p>¿Ya tienes cuenta? <a class="accent-link" href="{{url_for('login')}}">Inicia sesión</a></p></div></section>{% endblock %}
